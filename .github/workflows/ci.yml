name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  # Матрица Node: нижняя граница engines (>=20.19) и текущая LTS — как в agentic-buyer-ref.
  test-node:
    name: test (${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19", "22"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Р-1574: checkout оставляет в конфигурации http.https://github.com/.extraheader с GITHUB_TOKEN. Этот заголовок
          # перебивает подстановку insteadOf из шага ниже, и закрытый репозиторий проекта отвечает 404 при верном токене —
          # снаружи выглядит как неверный секрет. Код репозитория из этой конфигурации не читается: checkout уже сделан.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Зависимости agentic-buyer-ref и agentic-ps-platform лежат в закрытых репозиториях проекта и ставятся по git+https.
      # Без секрета шаг ничего не делает: форк и чужой PR секрета не получают, и красный шаг установки у них — ожидаемый,
      # а не замаскированный отказ доступа.
      - name: Доступ к закрытым репозиториям проекта (без секрета шаг ничего не делает)
        env:
          CORE_READ_TOKEN: ${{ secrets.CORE_READ_TOKEN }}
        run: |
          if [ -z "${CORE_READ_TOKEN}" ]; then
            echo "секрета CORE_READ_TOKEN нет — подмены адресов не настраиваются"
            exit 0
          fi
          # Р-1566: только --add. Без него каждая следующая подмена затирает предыдущую, и остаётся одна — последняя.
          # Формы ssh обязательны: без них npm молча уходит на ssh, и настоящая причина прячется за отказом по ключу.
          git config --global --add url."https://x-access-token:${CORE_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:${CORE_READ_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${CORE_READ_TOKEN}@github.com/".insteadOf "git@github.com:"
      - name: Установка зависимостей
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Аудит зависимостей работающего кода
        run: npm audit --omit=dev --audit-level=high
      # Исключение GHSA-fc5q-39xc-vjpf (ReDoS в picomatch, РП79, передача #21) **снято 19.11.2026** кирпичом К3.1:
      # предупреждение ушло из базы советов, и `npm audit --audit-level=high` без конфигурации исключений зелёный
      # четыре прогона подряд, в том числе на свежем `main` с пином стенда v0.49.1. Шаг вернулся к обычной команде;
      # `audit-ci` и `audit-ci.json` удалены. --omit=dev к этому шагу не применяется: через инструменты разработки
      # идут атаки на цепочку поставки, а в CI лежит токен доступа к закрытым репозиториям проекта.
      - name: Аудит инструментов разработки
        run: npm audit --audit-level=high
      - name: Проверка типов и ESLint
        run: npm run check
      - name: Сборка
        run: npm run build
      - name: Тесты
        run: npm test
      - name: Поиск ключей и реквизитов
        run: python3 .claude/hooks/scan_secrets.py .

  # Итоговая проверка test — её требует защита ветки main, имя не меняется.
  # if: always() обязателен: без него при красной матрице test была бы пропущена (skipped), а пропущенная обязательная
  # проверка засчитывается как пройденная (ревью agentic-buyer-ref #23 п. 1). Зелёная — только при success всей матрицы.
  test:
    needs: test-node
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Матрица Node прошла целиком
        run: test "${{ needs.test-node.result }}" = "success"
